# Secret scanning (fail-closed). Separate from release publishing to avoid
# changing release-job permissions or duplicating draft releases.
#
# Design note (Phase 1): git history from 2a386c8 through the pre-containment
# tip still contains the known updater private-key exposure. A full-history
# scan is therefore expected to fail until history scrubbing is decided.
# This workflow fails closed on:
#   1) secrets in the current working tree, and
#   2) secrets introduced in the commits of this push/PR.
# It does NOT claim that historical git blobs are clean.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks-workdir:
    name: gitleaks (working tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSL "$url" -o "$archive"
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current tree (no git history, redacted, fail-closed)
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --verbose \
            --exit-code 1

  gitleaks-delta:
    name: gitleaks (new commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for range)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSL "$url" -o "$archive"
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan commits introduced by this event (redacted, fail-closed)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$BEFORE_SHA"
            HEAD="$PUSH_SHA"
          fi

          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No reliable base SHA (new branch or empty before). Scanning working tree only for this job."
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --no-git \
              --redact \
              --verbose \
              --exit-code 1
            exit 0
          fi

          echo "Scanning commit range ${BASE}..${HEAD}"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${BASE}..${HEAD}" \
            --redact \
            --verbose \
            --exit-code 1
